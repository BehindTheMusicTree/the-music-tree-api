name: Feature Request
description: Suggest a new feature or enhancement for the API
title: "[Feature]: "
labels: ["enhancement", "feature"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please fill out the sections below to help us understand your request.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the API would this feature affect?
      options:
        - Track
        - Artist
        - Album
        - Genre
        - Tag
        - Playlist
        - Play
        - User
        - Spotify Integration
        - MusicBrainz Integration
        - Audio Fingerprinting
        - Filtering/Search
        - Middleware
        - Serializer
        - Model
        - View/API Endpoint
        - Exception Handling
        - Utils
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? Describe it clearly
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see
      placeholder: I would like to see...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered
      placeholder: I also considered...
    validations:
      required: false

  - type: textarea
    id: api-design
    attributes:
      label: Proposed API Design (if applicable)
      description: If this involves a new endpoint or API change, describe the proposed design
      placeholder: |
        Endpoint: POST /api/tracks/{id}/custom-action
        Request Body:
        {
          "param1": "...",
          "param2": "..."
        }
        Response:
        {
          "result": "..."
        }
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - Critical (Blocking my work)
        - High (Would significantly improve my workflow)
        - Medium (Nice to have)
        - Low (Minor improvement)
    validations:
      required: true

  - type: textarea
    id: use-cases
    attributes:
      label: Use Cases
      description: Describe specific use cases or scenarios where this feature would be helpful
      placeholder: |
        1. Use case 1: ...
        2. Use case 2: ...
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any other context, mockups, or examples about the feature request
      placeholder: Add any other context, screenshots, or examples here...
    validations:
      required: false

