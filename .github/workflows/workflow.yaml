name: Validation and Deployment

on:
    workflow_call:
    workflow_dispatch:
    push:
       branches: 
        - dev
        - prevent-posting-same-track
    pull_request:
        branches: [dev]

jobs:
  Pytest:
    runs-on: ubuntu-latest
    env:
      ENV: DEV
      DB_USERNAME: ${{ secrets.DEV_DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DEV_DB_PASSWORD }}
      DB_HOST: ${{ secrets.DEV_UNDOCKERIZED_DB_HOST }}
      DB_DATABASE: ${{ secrets.DEV_DB_DATABASE }}
      DB_PORT: ${{ secrets.DEV_DB_PORT }}
    services:
      postgres_main:
        image: postgres:14.12
        env:
          POSTGRES_USER: ${{ env.DB_USERNAME }}
          POSTGRES_PASSWORD: ${{ env.DB_PASSWORD }}
          POSTGRES_DB: ${{ env.DB_DATABASE }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready 
          --health-interval 10s 
          --health-timeout 5s 
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v3
        with:
           python-version: 3.11
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Install chromaprint
        run: sudo apt install libchromaprint-tools
      - name: Set up filesystem
        run: bash scripts/setup_filesystem_workflow.sh
      - name: Install flac
        run: sudo apt install flac
      - name: Install ffmpeg
        run: sudo apt install ffmpeg
      - name: Add fpcalc to PATH
        run: echo "${{ github.workspace }}/bin/fpcalc" >> $GITHUB_PATH
      - name: Run pytest
        run: pytest .

  Docker-webapp:
    name: Build and Publish on Docker Hub
    runs-on: ubuntu-latest
    needs: Pytest
    env:
      DOCKER_REPO: ${{ secrets.DOCKER_WEBAPP_REPO }}
      DOCKER_IMAGE_TAG: ${{ secrets.DOCKER_WEBAPP_IMAGE_TAG }}
    steps:
      - uses: actions/checkout@v2
      - name: Login to Docker Hub
        run: docker login -u ${{ secrets.DOCKER_USER }} -p '${{ secrets.DOCKER_PASSWORD }}'
      - name: Build Docker image
        run:
          docker-compose -f docker-compose.build.yml build
          --build-arg secretKey='${{ secrets.PROD_DJANGO_SECRET_KEY }}' 
          --build-arg env=TEST 
          --build-arg dbUsername=${{ secrets.PROD_DB_USERNAME }}
          --build-arg dbPassword='${{ secrets.PROD_DB_PASSWORD }}'
          --build-arg dbDatabase=${{ secrets.PROD_DB_DATABASE }}
          --build-arg dbHost=${{ secrets.PROD_DOCKERIZED_DB_HOST }}
          --build-arg dbPort=${{ secrets.PROD_DB_PORT }}
          --build-arg acoustidApiKey=${{ secrets.ACOUSTID_API_KEY }}
      - name: Publish Docker image
        run: docker-compose -f docker-compose.build.yml push

  Redeploy:
    name: Redeploy webhook call
    runs-on: ubuntu-latest
    needs: [Docker-webapp]
    steps:
      - name: Deploy docker container webhook
        run: curl -X POST ${{ secrets.BODZIFY_REDEPLOY_WEBHOOK_URL }}
