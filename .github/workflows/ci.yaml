name: API CI

on:
    workflow_call:
    workflow_dispatch:
    push:
       branches: 
        - main
        - dev
        - prevent-posting-same-track
    pull_request:
        branches: [main, dev]

jobs:
  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    environment: 
      name: CI_TEST
    env:
      ENV: CI_TEST
      DEBUG: True
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}

      DB_CONTAINER_NAME: ${{ vars.DB_CONTAINER_NAME }}
      DB_SUPERUSER_NAME: ${{ secrets.DB_SUPERUSER_NAME }}
      DB_SUPERUSER_PASSWORD: ${{ secrets.DB_SUPERUSER_PASSWORD }}
      DB_BODZIFY_API_DB_NAME: ${{ secrets.DB_BODZIFY_API_DB_NAME }}
      DB_BODZIFY_API_USERNAME: ${{ secrets.DB_BODZIFY_API_USERNAME }}
      DB_BODZIFY_API_USER_PASSWORD: ${{ secrets.DB_BODZIFY_API_USER_PASSWORD }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}

      AUDIO_FINGERPRINTER_PORT: ${{ secrets.TEST_AUDIO_FINGERPRINTER_PORT }}
      ACOUSTID_API_KEY: ${{ secrets.CI_TEST_ACOUSTID_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # - name: Setup Python ${{ matrix.python-version }}
      #   uses: actions/setup-python@v3
      #   with:
      #      python-version: 3.11

      # - name: Install requirements
      #   run: PIP_NO_CACHE_DIR=off pip install -r requirements.txt

      # - name: Install chromaprint
      #   run: sudo apt-get install libchromaprint-tools

      # - name: Install flac
      #   run: sudo apt-get install flac # apt not stable for CLI interface

      # - name: Install ffmpeg
      #   run: sudo apt-get install ffmpeg

      # - name: Add fpcalc to PATH
      #   run: echo "${{ github.workspace }}/bin/fpcalc" >> $GITHUB_PATH

      - name: Set up filesystem
        run: bash scripts/filesystem/filesystem_setup.ci_test.sh

      - name: Run audio-fingerprinter service
        run: |
          docker run -d \
            -p ${{ env.AUDIO_FINGERPRINTER_PORT}}:${{ env.AUDIO_FINGERPRINTER_PORT}} \
            -v /tmp/bodzify-api/uploaded-files/:/tmp/bodzify-audio-fingerprinter/pool/ \
            -e ENV=TEST \
            -e APP_PORT=${{ env.AUDIO_FINGERPRINTER_PORT }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.AUDIO_FINGERPRINTER_IMAGE_REPO }}:${{ secrets.AUDIO_FINGERPRINTER_IMAGE_TAG }}

      - name: Run db service
        run: |
          docker run -d \
            -p ${{ env.DB_PORT}}:${{ env.DB_PORT}} \
            -e POSTGRES_DB=${{ env.DB_BODZIFY_API_DB_NAME }} \
            -e POSTGRES_USER=${{ env.DB_SUPERUSER_NAME }} \
            -e POSTGRES_PASSWORD=${{ env.DB_SUPERUSER_PASSWORD }} \
            -e POSTGRES_PORT=${{ env.DB_PORT }} \
            --name=${{ env.DB_CONTAINER_NAME }} \
            --health-cmd="pg_isready" \
            --health-interval=10s \
            --health-timeout=5s \
            --health-retries=3 \
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DB_IMAGE_REPO }}:${{ secrets.DB_IMAGE_TAG }}

      - name: Init db
        run: ${{ github.workspace }}/scripts/data/db_init.sh
        
      - name: Init django data
        env:
          MANAGE_PATH: ${{ github.workspace }}/manage.py
        run: ${{ github.workspace }}/scripts/data/django_data_init.sh

      - name: Run pytest
        run: pytest

  build-and-push-to-dockerhub:
    name: Build / Push to Dockerhub
    runs-on: ubuntu-latest
    environment: 
      name: TEST
    needs: [pytest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Dockerhub
        run: echo "${{ secrets.DOCKERHUB_ACCESS_TOKEN }}" | docker login -u "${{ vars.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.API_IMAGE_REPO }}:${{ vars.API_IMAGE_TAG }}

  set-env-variables-on-server:
    name: Set environment variables on server
    runs-on: ubuntu-latest
    needs: [build-and-push-to-dockerhub]
    environment: 
      name: TEST
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.TEST_SERVER_CI_SSH_BODZIFY_PRIVATE_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh &&
          ssh-keyscan -H ${{ vars.TEST_SERVER_URL }} >> ~/.ssh/known_hosts

      - name: Set environment variables on server
        run: |
          ENV_FILE_PATH="${{ vars.DOCKER_COMPOSE_DIR }}${{ vars.API_ENV_VARIABLES_FILENAME }}"
          ssh ${{ secrets.TEST_SERVER_SSH_BODZIFY_USERNAME }}@${{ vars.TEST_SERVER_URL }} "
            rm -f $ENV_FILE_PATH &&
            echo 'ENV=TEST' >> $ENV_FILE_PATH &&
            echo 'DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}' >> $ENV_FILE_PATH &&
            echo 'DB_CONTAINER_NAME=${{ vars.DB_CONTAINER_NAME }}' >> $ENV_FILE_PATH &&
            echo 'DB_USERNAME=${{ secrets.DB_BODZIFY_API_USERNAME }}' >> $ENV_FILE_PATH && 
            echo 'DB_PASSWORD=${{ secrets.DB_BODZIFY_API_USER_PASSWORD }}' >> $ENV_FILE_PATH &&
            echo 'DB_DATABASE=${{ secrets.DB_BODZIFY_API_DB_NAME }}' >> $ENV_FILE_PATH &&
            echo 'DB_HOST=${{ secrets.DB_HOST }}' >> $ENV_FILE_PATH &&
            echo 'DB_PORT=${{ secrets.DB_PORT }}' >> $ENV_FILE_PATH &&
            echo 'ACOUSTID_API_KEY=${{ secrets.ACOUSTID_API_KEY }}' >> $ENV_FILE_PATH &&
            echo 'TEST_AUDIO_FINGERPRINTER_PORT=${{ secrets.TEST_AUDIO_FINGERPRINTER_PORT }}' >> $ENV_FILE_PATH &&
          "

  redeploy-webhook-call:
    name: Redeploy webhook call
    needs: [set-env-variables-on-server]
    uses: Bodzify/bodzify-redeploy-webhook-action/.github/workflows/workflow.yml@main
    with:
      env: TEST
    secrets: inherit
