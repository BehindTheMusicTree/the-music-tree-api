name: API CI

on:
    workflow_call:
    workflow_dispatch:
    push:
       branches: 
        - main
        - dev
        - prevent-posting-same-track
    pull_request:
        branches: [main, dev]

env:
  SSH_DESTINATION: ${{ secrets.TEST_SERVER_BODZIFY_USERNAME }}@${{ vars.TEST_SERVER_URL }}
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
  INIT_IF_NECESSARY_DB_AND_ROLE_SCRIPT_NAME: init_db_and_role_if_necessary.sh
  
jobs:
  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    environment: 
      name: CI_TEST
    env:
      ENV: ${{ vars.ENV }}

      APP_NAME: ${{ vars.APP_NAME }}
      APP_VERSION: ${{ vars.APP_VERSION }}

      DOCKER_NETWORK_NAME: ${{ vars.DOCKER_NETWORK_NAME }}
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}

      DEBUG: true

      DB_IS_NEEDED: true
      APP_IS_EXPOSED: false
      AUDIO_META_ANALYSE_IS_NEEDED: true
      TMP_UPLOADED_FILES_DEFAULT_INTERNAL_DIR: ${{ vars.TMP_UPLOADED_FILES_DEFAULT_INTERNAL_DIR }}
      ACOUSTID_API_KEY: ${{ secrets.ACOUSTID_API_KEY }}
      MEDIA_DEFAULT_INTERNAL_DIR: ${{ vars.MEDIA_DEFAULT_INTERNAL_DIR }}
      LIBRARIES_DIR_NAME: ${{ vars.LIBRARIES_DIR_NAME }}
      STATIC_FILES_ARE_NEEDED: false
      STATIC_FILES_DEFAULT_INTERNAL_DIR: ${{ vars.STATIC_FILES_DEFAULT_INTERNAL_DIR }}
      DJANGO_LOGS_ARE_NEEDED: false

      DB_IMAGE_REPO: ${{ vars.DB_IMAGE_REPO }}
      DB_VERSION: ${{ vars.DB_VERSION }}
      DB_CONTAINER_NAME: ${{ vars.DB_CONTAINER_NAME }}
      DB_DATA_DIR: ${{ vars.DB_DATA_DIR }}
      DB_SUPERUSER_NAME: ${{ vars.DB_SUPERUSER_NAME }}
      DB_SUPERUSER_PASSWORD: ${{ secrets.DB_SUPERUSER_PASSWORD }}
      DB_BODZIFY_API_DB_NAME: ${{ secrets.DB_BODZIFY_API_DB_NAME }}
      DB_BODZIFY_API_USERNAME: ${{ secrets.DB_BODZIFY_API_USERNAME }}
      DB_BODZIFY_API_USER_PASSWORD: ${{ secrets.DB_BODZIFY_API_USER_PASSWORD }}
      DB_HOST: ${{ vars.DB_HOST }}
      DB_PORT: ${{ vars.DB_PORT }}

      AFP_IMAGE_REPO: ${{ vars.AFP_IMAGE_REPO }}
      AFP_VERSION: ${{ vars.AFP_VERSION }}
      AFP_CONTAINER_NAME: ${{ vars.AFP_CONTAINER_NAME }}
      AFP_PORT: ${{ vars.AFP_PORT }}
      AFP_DOCKERIZED_POOL_DIR: ${{ vars.AFP_DOCKERIZED_POOL_DIR }}
      AFP_POST_ENDPOINT: ${{ vars.AFP_POST_ENDPOINT }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
           python-version: 3.12

      - name: Cache apt packages
        uses: actions/cache@v2
        with:
          path: /var/cache/apt
          key: ${{ runner.os }}-apt-${{ hashFiles('scripts/install_dependencies.sh') }}
          restore-keys: |
            ${{ runner.os }}-apt-
  
      - name: Cache pip
        uses: actions/cache@v2
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: sudo -E bash scripts/install_dependencies.sh

      - name: Add fpcalc to PATH
        run: echo "bin/fpcalc" >> $GITHUB_PATH

      - name: Install requirements
        run: PIP_NO_CACHE_DIR=off pip install -r requirements.txt

      - name: Set up filesystem
        run: bash scripts/setup_filesystem.sh

      - name: Run db and afp containers
        run: bash scripts/run_db_and_afp_containers.sh
        
      - name: Wait for db service to start
        run: |
          attempts=0
          MAX_ATTEMPS=10
          while ! pg_isready -h ${{ env.DB_HOST }} -p ${{ env.DB_PORT }}; do
            if [ $attempts -eq $MAX_ATTEMPS ]; then
              echo "DB service did not start within the expected time."
              exit 1
            fi
            echo "Waiting for DB service to start..."
            sleep 5
            attempts=$((attempts+1))
          done

      - name: Init db data
        run: |
          bash scripts/reinit_django_data.sh

      - name: Run pytest
        run: pytest

  collect-and-push-static-files:
    name: Collect and push static files
    runs-on: ubuntu-latest
    needs: [pytest]
    environment: 
      name: COLLECT_STATIC
    env:
      ENV: ${{ vars.ENV }}

      APP_NAME: ${{vars.APP_NAME}}
      APP_VERSION: ${{ vars.APP_VERSION }}

      DEBUG: false
      DB_IS_NEEDED: false
      APP_IS_EXPOSED: false
      AUDIO_META_ANALYSE_IS_NEEDED: false
      LIBRARIES_DIR_NAME: ${{ vars.LIBRARIES_DIR_NAME }}
      STATIC_FILES_ARE_NEEDED: true
      STATIC_FILES_DEFAULT_INTERNAL_DIR: ${{ vars.STATIC_FILES_DEFAULT_INTERNAL_DIR }}
      DJANGO_LOGS_ARE_NEEDED: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Remove previously collected static files
        run: rm -rf ${{ env.STATIC_FILES_DEFAULT_INTERNAL_DIR }}*

      - name: Set up filesystem
        run: bash scripts/setup_filesystem.sh

      - name: Collect static files
        run: python manage.py collectstatic --noinput

      - name: Configure Git
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'

      - name: Commit and push static files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add -A
          git diff --staged --exit-code || git commit -am "Add collected static files"
          git push

  build-and-push-eventually-to-dockerhub:
    name: Build / Push eventually to Dockerhub
    runs-on: ubuntu-latest
    # needs: [collect-and-push-static-files]
    environment: 
      name: TEST
    env:
      IMAGE_FULL_NAME: ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.APP_IMAGE_REPO }}:${{ vars.APP_VERSION }}
      IMAGE_URL: https://hub.docker.com/v2/repositories/${{ vars.DOCKERHUB_USERNAME }}/${{ vars.WEB_SERVER_IMAGE_REPO }}/tags/${{ vars.APP_VERSION }}/
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Dockerhub
        run: |
          echo "${{ secrets.DOCKERHUB_ACCESS_TOKEN }}" | \
          docker login -u "${{ env.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build Docker image
        id: build
        run: |
          docker build \
            --build-arg APP_NAME=${{ vars.APP_NAME }} \
            --build-arg APP_VERSION=${{ vars.APP_VERSION }} \
            --build-arg TMP_UPLOADED_FILES_DIR=${{ vars.TMP_UPLOADED_FILES_DIR }} \
            --build-arg MEDIA_DIR=${{ vars.MEDIA_DIR }} \
            --build-arg LIBRARIES_DIR_NAME=${{ vars.LIBRARIES_DIR_NAME }} \
            --build-arg STATIC_FILES_DIR=${{ vars.STATIC_FILES }} \
            --build-arg STATIC_FILES_DEFAULT_INTERNAL_DIR=${{ vars.STATIC_FILES_DEFAULT_INTERNAL_DIR }} \
            --build-arg DJANGO_LOG_DIR=${{ vars.DJANGO_LOG_DIR }} \
            --build-arg DJANGO_LOG_GENERAL_FILENAME=${{ vars.DJANGO_LOG_GENERAL_FILENAME }} \
            --build-arg DJANGO_LOG_INFO_FILENAME=${{ vars.DJANGO_LOG_INFO_FILENAME }} \
            --build-arg DJANGO_LOG_REQUESTS_FILENAME=${{ vars.DJANGO_LOG_REQUESTS_FILENAME }} \
            --build-arg DJANGO_LOG_REQUESTS_DEBUG_FILENAME=${{ vars.DJANGO_LOG_REQUESTS_DEBUG_FILENAME }} \
            --build-arg DJANGO_LOG_EXCEPTIONS_FILENAME=${{ vars.DJANGO_LOG_EXCEPTIONS_FILENAME }} \
            --build-arg DJANGO_LOG_DJANGO_FILENAME=${{ vars.DJANGO_LOG_DJANGO_FILENAME }} \
            --build-arg DJANGO_LOG_APP_FILENAME=${{ vars.DJANGO_LOG_APP_FILENAME }} \
            --build-arg GUNICORN_LOG_DIR=${{ vars.GUNICORN_LOG_DIR }} \
            --build-arg GUNICORN_LOG_ERROR_FILENAME=${{ vars.GUNICORN_LOG_ERROR_FILENAME }} \
            --build-arg GUNICORN_LOG_ACCESS_FILENAME=${{ vars.GUNICORN_LOG_ACCESS_FILENAME }} \
            --build-arg INIT_IF_NECESSARY_DB_AND_ROLE_SCRIPT_NAME=${{ env.INIT_IF_NECESSARY_DB_AND_ROLE_SCRIPT_NAME }} \
            -t ${{ env.IMAGE_FULL_NAME }} .

      - name: Check if image exists on Docker Hub
        id: check-image
        run: |
          IMAGE_EXISTS=$(curl -s -o /dev/null -w "%{http_code}" ${{ env.IMAGE_URL }})
          echo "image_exists=$IMAGE_EXISTS" >> $GITHUB_ENV

      - name: Compare image digests
        id: compare-digests
        if: steps.check-image.outputs.image_exists != '200'
        run: |
          LOCAL_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ env.IMAGE_FULL_NAME }} | cut -d'@' -f2 || echo "not_found")
          if [ "$LOCAL_DIGEST" == "not_found" ]; then
            echo "local_digest=not_found" >> $GITHUB_ENV
          else
            REMOTE_DIGEST=$(curl -s $IMAGE_URL | jq -r '.images[0].digest')
            echo "local_digest=$LOCAL_DIGEST" >> $GITHUB_ENV
            echo "remote_digest=$REMOTE_DIGEST" >> $GITHUB_ENV
          fi

      - name: Push Docker image
        if: steps.compare-digests.outputs.local_digest == 'not_found' || steps.compare-digests.outputs.local_digest != steps.compare-digests.outputs.remote_digest
        run: |
          docker push ${{ env.IMAGE_FULL_NAME }}

  set-env-variables-on-server:
    name: Set environment variables on server
    runs-on: ubuntu-latest
    # needs: [build-and-push-eventually-to-dockerhub]
    environment: 
      name: TEST
    env:
      DOCKER_COMPOSE_DIR: ${{ vars.WEBHOOK_DIR }}${{ vars.WEBHOOK_REDEPLOYMENT_DIR_NAME }}/${{ vars.DOCKER_COMPOSE_DIR_NAME }}/
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.TEST_SERVER_SSH_BODZIFY_PRIVATE_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh &&
          ssh-keyscan -H ${{ vars.TEST_SERVER_URL }} >> ~/.ssh/known_hosts

      - name: Set api environment variables on server
        env: 
          API_ENV_FILE: "${{ env.DOCKER_COMPOSE_DIR }}${{ vars.DOCKERIZED_APP_ENV_FILENAME }}"
        run: |
          ssh ${{ env.SSH_DESTINATION }} bash -s << 'EOF'
            rm -f ${{ env.API_ENV_FILE }} &&
            touch ${{ env.API_ENV_FILE }} &&

            echo 'DJANGO_SECRET_KEY="${{ secrets.DJANGO_SECRET_KEY }}"' >> ${{ env.API_ENV_FILE }} &&
            echo 'ACOUSTID_API_KEY="${{ secrets.ACOUSTID_API_KEY }}"' >> ${{ env.API_ENV_FILE }} &&
            echo 'CSRF_TRUSTED_ORIGINS=${{ vars.CSRF_TRUSTED_ORIGINS }}' >> ${{ env.API_ENV_FILE }} &&
            echo 'ALLOWED_HOSTS=${{ vars.ALLOWED_HOSTS }}' >> ${{ env.API_ENV_FILE }} &&
            echo 'DB_BODZIFY_API_DB_NAME=${{ secrets.DB_BODZIFY_API_DB_NAME }}' >> ${{ env.API_ENV_FILE }} &&
            echo 'DB_BODZIFY_API_USERNAME=${{ secrets.DB_BODZIFY_API_USERNAME }}' >> ${{ env.API_ENV_FILE }} &&
            echo 'DB_BODZIFY_API_USER_PASSWORD="${{ secrets.DB_BODZIFY_API_USER_PASSWORD }}"' >> ${{ env.API_ENV_FILE }} &&
            echo 'DB_CONTAINER_NAME=${{ vars.DB_CONTAINER_NAME }}' >> ${{ env.API_ENV_FILE }} &&
            echo 'DB_PORT=${{ vars.DB_PORT }}' >> ${{ env.API_ENV_FILE }} &&
            
            echo 'AFP_CONTAINER_NAME=${{ vars.AFP_CONTAINER_NAME }}' >> ${{ env.API_ENV_FILE }} &&
            echo 'AFP_PORT=${{ vars.AFP_PORT }}' >> ${{ env.API_ENV_FILE }} &&
            echo 'AFP_POST_ENDPOINT=${{ vars.AFP_POST_ENDPOINT }}' >> ${{ env.API_ENV_FILE }}
          EOF

      - name: Set db environment variables on server
        env: 
          DB_ENV_FILE: "${{ env.DOCKER_COMPOSE_DIR }}${{ vars.DB_ENV_FILENAME }}"
        run: |
          ssh ${{ env.SSH_DESTINATION }} "
            rm -f ${{ env.DB_ENV_FILE }} &&
            touch ${{ env.DB_ENV_FILE }} &&

            echo 'ENV=TEST' >> ${{ env.DB_ENV_FILE }} &&

            echo 'POSTGRES_DB=${{ secrets.DB_BODZIFY_API_DB_NAME }}' >> ${{ env.DB_ENV_FILE }} &&
            echo 'POSTGRES_USER=${{ vars.DB_SUPERUSER_NAME }}' >> ${{ env.DB_ENV_FILE }} &&
            echo 'POSTGRES_PASSWORD=${{ secrets.DB_SUPERUSER_PASSWORD }}' >> ${{ env.DB_ENV_FILE }} &&
            echo 'POSTGRES_PORT=${{ vars.DB_PORT }}' >> ${{ env.DB_ENV_FILE }}
          "

      - name: Set afp environment variables on server
        env: 
          AFP_ENV_FILE: "${{ env.DOCKER_COMPOSE_DIR }}${{ vars.AFP_ENV_FILENAME }}"
        run: |
          ssh ${{ env.SSH_DESTINATION }} "
            rm -f ${{ env.AFP_ENV_FILE }} &&
            touch ${{ env.AFP_ENV_FILE }} &&

            echo 'ENV=${{ vars.ENV }}' >> ${{ env.AFP_ENV_FILE }} &&
            echo 'DEBUG=true' >> ${{ env.AFP_ENV_FILE }} &&
            echo 'APP_PORT=${{ vars.AFP_PORT }}' >> ${{ env.AFP_ENV_FILE }}
          "

  set-partial-docker-compose-on-server:
    name: Set partial docker-compose on server
    runs-on: ubuntu-latest
    needs: [build-and-push-eventually-to-dockerhub]
    environment: 
      name: TEST
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.TEST_SERVER_SSH_BODZIFY_PRIVATE_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh && ssh-keyscan -H ${{ vars.TEST_SERVER_URL }} >> ~/.ssh/known_hosts      
          
      - name: Generate partial docker compose file
        env: 
          DOCKER_COMPOSE_PART_FILENAME: ${{ vars.DOCKER_COMPOSE_PART_FILENAME }}
          DOCKER_NETWORK_NAME: ${{ vars.DOCKER_NETWORK_NAME }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}

          DB_IMAGE_REPO: ${{ vars.DB_IMAGE_REPO }}
          DB_VERSION: ${{ vars.DB_VERSION }}
          DB_CONTAINER_NAME: ${{ vars.DB_CONTAINER_NAME }}
          DB_DATA_DIR: ${{ vars.DB_DATA_DIR }}
          DB_PORT_HOST: ${{ vars.DB_PORT_HOST }}
          DB_PORT: ${{ vars.DB_PORT }}
          DB_ENV_FILENAME: ${{ vars.DB_ENV_FILENAME }}

          AFP_IMAGE_REPO: ${{ vars.AFP_IMAGE_REPO }}
          AFP_VERSION: ${{ vars.AFP_VERSION }}
          AFP_CONTAINER_NAME: ${{ vars.AFP_CONTAINER_NAME }}
          AFP_PORT: ${{ vars.AFP_PORT }}
          AFP_ENV_FILENAME: ${{ vars.AFP_ENV_FILENAME }}
          AFP_DOCKERIZED_POOL_DIR: ${{ vars.AFP_DOCKERIZED_POOL_DIR }}
          AFP_DOCKERIZED_FLASK_LOG_DIR: ${{ vars.AFP_DOCKERIZED_FLASK_LOG_DIR }}
          AFP_DOCKERIZED_GUNICORN_LOG_DIR: ${{ vars.AFP_DOCKERIZED_GUNICORN_LOG_DIR }}

          APP_SERVICE_NAME: ${{ vars.API_SERVICE_NAME }}
          APP_IMAGE_REPO: ${{ vars.APP_IMAGE_REPO }}
          APP_VERSION: ${{ vars.APP_VERSION }}
          APP_CONTAINER_NAME: ${{ vars.APP_CONTAINER_NAME }}
          APP_PORT: ${{ vars.API_PORT }}
          APP_ENV_FILENAME: ${{ vars.DOCKERIZED_APP_ENV_FILENAME }}
          GUNICORN_LOG_DIR: ${{ vars.GUNICORN_LOG_DIR }}
          GUNICORN_LOG_ERROR_FILENAME: ${{ vars.GUNICORN_LOG_ERROR_FILENAME }}
          GUNICORN_LOG_ACCESS_FILENAME: ${{ vars.GUNICORN_LOG_ACCESS_FILENAME }}
          DJANGO_LOG_DIR: ${{ vars.DJANGO_LOG_DIR }}
          MEDIA_DIR: ${{ vars.MEDIA_DIR }}
          STATIC_FILES_DIR: ${{ vars.STATIC_FILES }}
          TMP_UPLOADED_FILES_DIR: ${{ vars.TMP_UPLOADED_FILES_DIR }}
        run: |
          bash scripts/generate_docker_compose_part.sh

      - name: Transfer partial docker-compose file to server
        env:
          DOCKER_COMPOSE_PART_FILE: ${{ vars.WEBHOOK_DIR }}${{ vars.WEBHOOK_REDEPLOYMENT_DIR_NAME }}/${{ vars.DOCKER_COMPOSE_DIR_NAME }}/${{ vars.DOCKER_COMPOSE_PARTS_DIR_NAME }}/${{ vars.DOCKER_COMPOSE_PART_FILENAME }}
        run: |
          scp scripts/${{ vars.DOCKER_COMPOSE_PART_FILENAME }} ${{ env.SSH_DESTINATION }}:${{ env.DOCKER_COMPOSE_PART_FILE }}


  redeploy-webhook-call:
    name: Redeploy webhook call
    needs: [set-env-variables-on-server, set-partial-docker-compose-on-server, build-and-push-eventually-to-dockerhub]
    uses: Bodzify/bodzify-server-management/.github/workflows/call-redeployment-webhook.yml@main
    with:
      env: TEST
    secrets: inherit
