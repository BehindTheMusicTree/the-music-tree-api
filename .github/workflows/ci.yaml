name: CI

on:
    workflow_call:
    workflow_dispatch:
    push:
       branches: 
        - dev
        - prevent-posting-same-track
    pull_request:
        branches: [dev]

jobs:
  Pytest:
    runs-on: ubuntu-latest
    env:
      ENV: GITHUB_CI_TEST
      DEBUG: True
      SECRET_KEY: ${{ secrets.CI_TEST_SECRET_KEY }}
      DB_DATABASE: ${{ secrets.CI_TEST_DB_DATABASE }}
      DB_USERNAME: ${{ secrets.CI_TEST_DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.CI_TEST_DB_PASSWORD }}
      DB_URL: ${{ secrets.CI_TEST_DB_URL }}
      DB_PORT: ${{ secrets.CI_TEST_DB_PORT }}
      AUDIO_FINGERPRINTER_PORT: ${{ secrets.CI_TEST_AUDIO_FINGERPRINTER_PORT }}
      ACOUSTID_API_KEY: ${{ secrets.CI_TEST_ACOUSTID_API_KEY }}

    services:
      audio-fingerprinter:
        image: mignot/audio-fingerprinter:latest
        ports:
          - 3000:5000
        volumes:
          - /tmp/bodzify-api/uploaded-files/:/tmp/audio-fingerprinter/pool/

      postgres_main:
        image: postgres:14.12
        env:
          POSTGRES_USER: ${{ env.DB_USERNAME }}
          POSTGRES_PASSWORD: ${{ env.DB_PASSWORD }}
          POSTGRES_DB: ${{ env.DB_DATABASE }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready 
          --health-interval 10s 
          --health-timeout 5s 
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v3
        with:
           python-version: 3.11
      - name: Install requirements
        run: PIP_NO_CACHE_DIR=off pip install -r requirements.txt
      - name: Install chromaprint
        run: sudo apt-get install libchromaprint-tools
      - name: Set up filesystem
        run: bash scripts/setup_filesystem_github_ci_test.sh
      - name: Install flac
        run: sudo apt-get install flac # apt not stable for CLI interface
      - name: Install ffmpeg
        run: sudo apt-get install ffmpeg
      - name: Add fpcalc to PATH
        run: echo "${{ github.workspace }}/bin/fpcalc" >> $GITHUB_PATH
      - name: Run pytest
        run: pytest bodzify_api/test/view/track/input/method/create/test_should_cancel_if_duplicate_fingerprint.py    

  Docker-webapp:
    name: Build and Publish on Docker Hub
    runs-on: ubuntu-latest
    needs: Pytest
    env:
      DOCKER_REPO: ${{ secrets.DOCKER_WEBAPP_REPO }}
      DOCKER_IMAGE_TAG: ${{ secrets.DOCKER_WEBAPP_IMAGE_TAG }}
    steps:
      - uses: actions/checkout@v2
      - name: Login to Docker Hub
        run: docker login -u ${{ secrets.DOCKER_USER }} -p '${{ secrets.DOCKER_PASSWORD }}'
      - name: Build Docker image
        run:
          docker-compose -f docker-compose.build.yml build
          --build-arg secretKey='${{ secrets.TEST_DJANGO_SECRET_KEY }}' 
          --build-arg dbUsername=${{ secrets.TEST_DB_USERNAME }}
          --build-arg dbPassword='${{ secrets.TEST_DB_PASSWORD }}'
          --build-arg dbDatabase=${{ secrets.TEST_DB_DATABASE }}
          --build-arg dbUrl=${{ secrets.TEST_DB_URL }}
          --build-arg dbPort=${{ secrets.TEST_DB_PORT }}
          --build-arg acoustidApiKey=${{ secrets.ACOUSTID_API_KEY }}
          --build-arg audioFingerprinterPort=${{ secrets.TEST_AUDIO_FINGERPRINTER_PORT }}
      - name: Publish Docker image
        run: docker-compose -f docker-compose.build.yml push

  Redeploy:
    name: Redeploy webhook call
    runs-on: ubuntu-latest
    needs: [Docker-webapp]
    steps:
      - name: Deploy docker container webhook
        run: curl -X POST ${{ secrets.BODZIFY_REDEPLOY_WEBHOOK_URL }}
