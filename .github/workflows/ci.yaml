name: API CI

on:
    workflow_call:
    workflow_dispatch:
    push:
       branches: 
        - main
        - dev
        - prevent-posting-same-track
    pull_request:
        branches: [main, dev]

env:
  SSH_DESTINATION: ${{ secrets.TEST_SERVER_BODZIFY_USERNAME }}@${{ vars.TEST_SERVER_URL }}
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
  APP_IMAGE_REPO: ${{ vars.API_IMAGE_REPO }}

jobs:
  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    environment: 
      name: CI_TEST
    env:
      ENV: ${{ vars.ENV }}

      APP_NAME: ${{ vars.APP_NAME }}
      APP_VERSION: ${{ vars.APP_VERSION }}

      DOCKER_NETWORK_NAME: ${{ vars.DOCKER_NETWORK_NAME }}
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}

      DEBUG: true

      DB_IS_NEEDED: true
      APP_IS_EXPOSED: false
      AUDIO_META_ANALYSE_IS_NEEDED: true
      TMP_UPLOADED_FILES_DEFAULT_INTERNAL_DIR: ${{ vars.TMP_UPLOADED_FILES_DEFAULT_INTERNAL_DIR }}
      ACOUSTID_API_KEY: ${{ secrets.ACOUSTID_API_KEY }}
      MEDIA_DEFAULT_INTERNAL_DIR: ${{ vars.MEDIA_DEFAULT_INTERNAL_DIR }}
      LIBRARIES_DIR_NAME: ${{ vars.LIBRARIES_DIR_NAME }}
      STATIC_FILES_ARE_NEEDED: false
      STATIC_FILES_DEFAULT_INTERNAL_DIR: ${{ vars.STATIC_FILES_DEFAULT_INTERNAL_DIR }}
      DJANGO_LOGS_ARE_NEEDED: false

      DB_IMAGE_REPO: ${{ vars.DB_IMAGE_REPO }}
      DB_IMAGE_TAG: ${{ vars.DB_IMAGE_TAG }}
      DB_CONTAINER_NAME: ${{ vars.DB_CONTAINER_NAME }}
      DB_DATA_DIR: ${{ vars.DB_DATA_DIR }}
      DB_SUPERUSER_NAME: ${{ vars.DB_SUPERUSER_NAME }}
      DB_SUPERUSER_PASSWORD: ${{ secrets.DB_SUPERUSER_PASSWORD }}
      DB_BODZIFY_API_DB_NAME: ${{ secrets.DB_BODZIFY_API_DB_NAME }}
      DB_BODZIFY_API_USERNAME: ${{ secrets.DB_BODZIFY_API_USERNAME }}
      DB_BODZIFY_API_USER_PASSWORD: ${{ secrets.DB_BODZIFY_API_USER_PASSWORD }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}

      AUDIO_FINGERPRINTER_IMAGE_REPO: ${{ vars.AUDIO_FINGERPRINTER_IMAGE_REPO }}
      AUDIO_FINGERPRINTER_IMAGE_TAG: ${{ vars.AUDIO_FINGERPRINTER_IMAGE_TAG }}
      AUDIO_FINGERPRINTER_CONTAINER_NAME: ${{ vars.AUDIO_FINGERPRINTER_CONTAINER_NAME }}
      AUDIO_FINGERPRINTER_PORT: ${{ secrets.AUDIO_FINGERPRINTER_PORT }}
      AUDIO_FINGERPRINTER_DOCKERIZED_POOL_DIR: ${{ vars.AUDIO_FINGERPRINTER_DOCKERIZED_POOL_DIR }}
      AUDIO_FINGERPRINTER_POST_ENDPOINT: ${{ vars.AUDIO_FINGERPRINTER_POST_ENDPOINT }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
           python-version: 3.11

      - name: Install dependencies
        run: sudo -E bash scripts/install_dependencies.sh

      - name: Add fpcalc to PATH
        run: echo "bin/fpcalc" >> $GITHUB_PATH

      - name: Install requirements
        run: PIP_NO_CACHE_DIR=off pip install -r requirements.txt

      - name: Set up filesystem
        run: bash scripts/setup_filesystem.sh

      - name: Run db and afp containers
        run: bash scripts/run_db_and_afp_containers.sh
        
      - name: Wait for db service to start
        run: |
          attempts=0
          MAX_ATTEMPS=10
          while ! pg_isready -h ${{ env.DB_HOST }} -p ${{ env.DB_PORT }}; do
            if [ $attempts -eq $MAX_ATTEMPS ]; then
              echo "DB service did not start within the expected time."
              exit 1
            fi
            echo "Waiting for DB service to start..."
            sleep 5
            attempts=$((attempts+1))
          done

      - name: Echo afp container logs
        run: docker logs ${{ env.AUDIO_FINGERPRINTER_CONTAINER_NAME }}

      - name: Init db data
        run: |
          bash scripts/data/reinit_django_data.sh

      - name: Run pytest
        run: pytest

  collect-and-push-static-files:
    name: Collect and push static files
    runs-on: ubuntu-latest
    needs: [pytest]
    environment: 
      name: COLLECT_STATIC
    env:
      ENV: ${{ vars.ENV }}

      APP_NAME: ${{vars.APP_NAME}}
      APP_VERSION: ${{ vars.APP_VERSION }}

      DEBUG: false
      DB_IS_NEEDED: false
      APP_IS_EXPOSED: false
      AUDIO_META_ANALYSE_IS_NEEDED: false
      LIBRARIES_DIR_NAME: ${{ vars.LIBRARIES_DIR_NAME }}
      STATIC_FILES_ARE_NEEDED: true
      STATIC_FILES_DEFAULT_INTERNAL_DIR: ${{ vars.STATIC_FILES_DEFAULT_INTERNAL_DIR }}
      DJANGO_LOGS_ARE_NEEDED: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Remove previously collected static files
        run: rm -rf ${{ env.STATIC_FILES_DEFAULT_INTERNAL_DIR }}*

      - name: Set up filesystem
        run: bash scripts/setup_filesystem.sh

      - name: Collect static files
        run: python manage.py collectstatic --noinput

      - name: Configure Git
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'

      - name: Commit and push static files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add -A
          git diff --staged --exit-code || git commit -am "Add collected static files"
          git push

  build-and-push-to-dockerhub:
    name: Build / Push to Dockerhub
    runs-on: ubuntu-latest
    needs: [collect-and-push-static-files]
    environment: 
      name: TEST
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Dockerhub
        run: |
          echo "${{ secrets.DOCKERHUB_ACCESS_TOKEN }}" | \
          docker login -u "${{ env.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/${{ vars.APP_IMAGE_REPO }}:${{ vars.APP_VERSION }}
          build-args: |
            APP_NAME: ${{ vars.APP_NAME }}
            APP_VERSION: ${{ vars.APP_VERSION }}

            TMP_UPLOADED_FILES_DIR=${{ vars.TMP_UPLOADED_FILES_DIR }}
            MEDIA_DIR=${{ vars.MEDIA_DIR }}
            LIBRARIES_DIR_NAME=${{ vars.LIBRARIES_DIR_NAME }}

            STATIC_FILES_DIR=${{ vars.STATIC_FILES_DIR }}
            STATIC_FILES_DEFAULT_INTERNAL_DIR=${{ vars.STATIC_FILES_DEFAULT_INTERNAL_DIR }}

            DJANGO_LOG_DIR=${{ vars.DJANGO_LOG_DIR }}
            DJANGO_LOG_GENERAL_FILENAME=${{ vars.DJANGO_LOG_GENERAL_FILENAME }}
            DJANGO_LOG_INFO_FILENAME=${{ vars.DJANGO_LOG_INFO_FILENAME }}
            DJANGO_LOG_REQUESTS_FILENAME=${{ vars.DJANGO_LOG_REQUESTS_FILENAME }}
            DJANGO_LOG_REQUESTS_DEBUG_FILENAME=${{ vars.DJANGO_LOG_REQUESTS_DEBUG_FILENAME }}
            DJANGO_LOG_EXCEPTIONS_FILENAME=${{ vars.DJANGO_LOG_EXCEPTIONS_FILENAME }}
            DJANGO_LOG_DJANGO_FILENAME=${{ vars.DJANGO_LOG_DJANGO_FILENAME }}
            DJANGO_LOG_APP_FILENAME=${{ vars.DJANGO_LOG_APP_FILENAME }}

            GUNICORN_LOG_DIR=${{ vars.GUNICORN_LOG_DIR }}
            GUNICORN_LOG_ERROR_FILENAME=${{ vars.GUNICORN_LOG_ERROR_FILENAME }}
            GUNICORN_LOG_ACCESS_FILENAME=${{ vars.GUNICORN_LOG_ACCESS_FILENAME }}

            DJANGO_LOG_DIR_SYMLINK_TARGET=${{ vars.API_DJANGO_LOG_DIR_SYMLINK_TARGET }}
            MEDIA_DIR_SYMLINK_TARGET=${{ vars.API_MEDIA_DIR_SYMLINK_TARGET }}
            STATIC_FILES_DIR_SYMLINK_TARGET=${{ vars.API_STATIC_FILES_DIR_SYMLINK_TARGET }}
            TMP_UPLOADED_FILES_DIR_SYMLINK_TARGET=${{ vars.API_TMP_UPLOADED_FILES_DIR_SYMLINK_TARGET }}
            GUNICORN_LOG_DIR_SYMLINK_TARGET=${{ vars.API_GUNICORN_LOG_DIR_SYMLINK_TARGET }}

  set-env-variables-on-server:
    name: Set environment variables on server
    runs-on: ubuntu-latest
    needs: [build-and-push-to-dockerhub]
    environment: 
      name: TEST
    env:
      DOCKER_COMPOSE_DIR: ${{ vars.WEBHOOK_DIR }}${{ vars.WEBHOOK_REDEPLOYMENT_DIR_NAME }}/${{ vars.DOCKER_COMPOSE_DIR_NAME }}/
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.TEST_SERVER_SSH_BODZIFY_PRIVATE_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh &&
          ssh-keyscan -H ${{ vars.TEST_SERVER_URL }} >> ~/.ssh/known_hosts

      - name: Set api environment variables on server
        env: 
          API_ENV_FILE: "${{ env.DOCKER_COMPOSE_DIR }}${{ vars.DOCKERIZED_APP_ENV_FILENAME }}"
        run: |
          ssh ${{ env.SSH_DESTINATION }} "
            rm -f ${{ env.API_ENV_FILE }} &&
            touch ${{ env.API_ENV_FILE }} &&

            echo 'DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}' >> ${{ env.API_ENV_FILE }} &&
            echo 'ACOUSTID_API_KEY=${{ secrets.ACOUSTID_API_KEY }}' >> ${{ env.API_ENV_FILE }} &&
            
            echo 'DB_BODZIFY_API_DB_NAME=${{ secrets.DB_BODZIFY_API_DB_NAME }}' >> ${{ env.API_ENV_FILE }} &&
            echo 'DB_BODZIFY_API_USERNAME=${{ secrets.DB_BODZIFY_API_USERNAME }}' >> ${{ env.API_ENV_FILE }} &&
            echo 'DB_BODZIFY_API_USER_PASSWORD=${{ secrets.DB_BODZIFY_API_USER_PASSWORD }}' >> ${{ env.API_ENV_FILE }} &&
            echo 'DB_HOST=${{ secrets.DB_HOST }}' >> ${{ env.API_ENV_FILE }} &&
            echo 'DB_PORT=${{ secrets.DB_PORT }}' >> ${{ env.API_ENV_FILE }} &&
            
            echo 'AUDIO_FINGERPRINTER_CONTAINER_NAME=${{ vars.AUDIO_FINGERPRINTER_CONTAINER_NAME }}' \
              >> ${{ env.API_ENV_FILE }} &&
            echo 'AUDIO_FINGERPRINTER_PORT=${{ secrets.TEST_AUDIO_FINGERPRINTER_PORT }}' >> ${{ env.API_ENV_FILE }} &&
            echo 'AUDIO_FINGERPRINTER_POST_ENDPOINT=${{ vars.AUDIO_FINGERPRINTER_POST_ENDPOINT }}' \
              >> ${{ env.API_ENV_FILE }}
          "

      - name: Set db environment variables on server
        env: 
          DB_ENV_FILE: "${{ env.DOCKER_COMPOSE_DIR }}${{ vars.DB_ENV_FILENAME }}"
        run: |
          ssh ${{ env.SSH_DESTINATION }} "
            rm -f ${{ env.DB_ENV_FILE }} &&
            touch ${{ env.DB_ENV_FILE }} &&

            echo 'ENV=TEST' >> ${{ env.DB_ENV_FILE }} &&

            echo 'POSTGRES_DB=${{ secrets.DB_BODZIFY_API_DB_NAME }}' >> ${{ env.DB_ENV_FILE }} &&
            echo 'POSTGRES_USER=${{ secrets.DB_SUPERUSER_NAME }}' >> ${{ env.DB_ENV_FILE }} &&
            echo 'POSTGRES_PASSWORD=${{ secrets.DB_SUPERUSER_PASSWORD }}' >> ${{ env.DB_ENV_FILE }} &&
            echo 'POSTGRES_PORT=${{ secrets.DB_PORT }}' >> ${{ env.DB_ENV_FILE }}
          "

      - name: Set afp environment variables on server
        env: 
          AFP_ENV_FILE: "${{ env.DOCKER_COMPOSE_DIR }}${{ vars.AUDIO_FINGERPRINTER_ENV_FILENAME }}"
        run: |
          ssh ${{ env.SSH_DESTINATION }} "
            rm -f ${{ env.AFP_ENV_FILE }} &&
            touch ${{ env.AFP_ENV_FILE }} &&

            echo 'ENV=${{ vars.ENV }}' >> ${{ env.AFP_ENV_FILE }} &&
            echo 'DEBUG=true' >> ${{ env.AFP_ENV_FILE }} &&
            echo 'APP_PORT=${{ secrets.AUDIO_FINGERPRINTER_PORT }}' >> ${{ env.AFP_ENV_FILE }}
          "

  set-partial-docker-compose-on-server:
    name: Set partial docker-compose on server
    runs-on: ubuntu-latest
    needs: [build-and-push-to-dockerhub]
    environment: 
      name: TEST
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.TEST_SERVER_SSH_BODZIFY_PRIVATE_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh && ssh-keyscan -H ${{ vars.TEST_SERVER_URL }} >> ~/.ssh/known_hosts      
          
      - name: Generate partial docker compose file
        env: 
          DOCKER_COMPOSE_PART_FILENAME: ${{ vars.DOCKER_COMPOSE_PART_FILENAME }}
          DOCKER_NETWORK_NAME: ${{ vars.DOCKER_NETWORK_NAME }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}

          DB_IMAGE_REPO: ${{ vars.DB_IMAGE_REPO }}
          DB_IMAGE_TAG: ${{ vars.DB_IMAGE_TAG }}
          DB_CONTAINER_NAME: ${{ vars.DB_CONTAINER_NAME }}
          DB_DATA_DIR: ${{ vars.DB_DATA_DIR }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_ENV_FILENAME: ${{ vars.DB_ENV_FILENAME }}

          AUDIO_FINGERPRINTER_IMAGE_REPO: ${{ vars.AUDIO_FINGERPRINTER_IMAGE_REPO }}
          AUDIO_FINGERPRINTER_IMAGE_TAG: ${{ vars.AUDIO_FINGERPRINTER_IMAGE_TAG }}
          AUDIO_FINGERPRINTER_CONTAINER_NAME: ${{ vars.AUDIO_FINGERPRINTER_CONTAINER_NAME }}
          AUDIO_FINGERPRINTER_PORT: ${{ secrets.AUDIO_FINGERPRINTER_PORT }}
          AUDIO_FINGERPRINTER_ENV_FILENAME: ${{ vars.AUDIO_FINGERPRINTER_ENV_FILENAME }}
          AUDIO_FINGERPRINTER_DOCKERIZED_POOL_DIR: ${{ vars.AUDIO_FINGERPRINTER_DOCKERIZED_POOL_DIR }}
          AUDIO_FINGERPRINTER_DOCKERIZED_FLASK_LOG_DIR: ${{ vars.AUDIO_FINGERPRINTER_DOCKERIZED_FLASK_LOG_DIR }}
          AUDIO_FINGERPRINTER_DOCKERIZED_GUNICORN_LOG_DIR: ${{ vars.AUDIO_FINGERPRINTER_DOCKERIZED_GUNICORN_LOG_DIR }}

          APP_IMAGE_REPO: ${{ vars.APP_IMAGE_REPO }}
          APP_VERSION: ${{ vars.APP_VERSION }}
          APP_CONTAINER_NAME: ${{ vars.APP_CONTAINER_NAME }}
          APP_PORT: ${{ secrets.APP_PORT }}
          APP_ENV_FILENAME: ${{ vars.DOCKERIZED_APP_ENV_FILENAME }}
          GUNICORN_LOG_DIR: ${{ vars.GUNICORN_LOG_DIR }}
          GUNICORN_LOG_ERROR_FILENAME: ${{ vars.GUNICORN_LOG_ERROR_FILENAME }}
          GUNICORN_LOG_ACCESS_FILENAME: ${{ vars.GUNICORN_LOG_ACCESS_FILENAME }}
          DJANGO_LOG_DIR: ${{ vars.DJANGO_LOG_DIR }}
          MEDIA_DIR: ${{ vars.MEDIA_DIR }}
          TMP_UPLOADED_FILES_DIR: ${{ vars.TMP_UPLOADED_FILES_DIR }}
        run: |
          bash scripts/generate_docker_compose_part.sh

      - name: Transfer partial docker-compose file to server
        env:
          DOCKER_COMPOSE_PART_FILE: ${{ vars.WEBHOOK_DIR }}${{ vars.WEBHOOK_REDEPLOYMENT_DIR_NAME }}/${{ vars.DOCKER_COMPOSE_DIR_NAME }}/${{ vars.DOCKER_COMPOSE_PARTS_DIR_NAME }}/${{ vars.DOCKER_COMPOSE_PART_FILENAME }}
        run: |
          scp scripts/${{ vars.DOCKER_COMPOSE_PART_FILENAME }} ${{ env.SSH_DESTINATION }}:${{ env.DOCKER_COMPOSE_PART_FILE }}


  redeploy-webhook-call:
    name: Redeploy webhook call
    needs: [set-env-variables-on-server, set-partial-docker-compose-on-server]
    uses: Bodzify/bodzify-server-management/.github/workflows/call-redeployment-webhook.yml@main
    with:
      env: TEST
    secrets: inherit
