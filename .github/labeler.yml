  - 'bodzify_api/model/user/**'
  - 'bodzify_api/serializer/model/user/**'
  - 'bodzify_api/view/viewset/model/UserViewSet.py'
  - 'bodzify_api/test/view/user/**'
  - 'bodzify_api/fixtures/users/**'

spotify:
  - 'bodzify_api/model/spotify_resource/**'
  - 'bodzify_api/model/spotify/**'
  - 'bodzify_api/serializer/model/spotify/**'
  - 'bodzify_api/view/spotify/**'
  - 'bodzify_api/utils/spotify/**'
  - 'bodzify_api/test/spotify/**'
  - 'bodzify_api/exception/spotify.py'

musicbrainz:
  - 'bodzify_api/model/musicbrainz_resource/**'
  - 'bodzify_api/utils/musicbrainz/**'
  - 'bodzify_api/exception/musicbrainz.py'

audio-fingerprinting:
  - 'bodzify_api/utils/audio_fingerprinter/**'
  - 'bodzify_api/test/view/track/**/fingerprint/**'

filtering:
  - 'bodzify_api/filtering/**'
  - 'bodzify_api/view/viewset/SearchViewSet.py'

middleware:
  - 'bodzify_api/middleware/**'

serializer:
  - 'bodzify_api/serializer/**'

model:
  - 'bodzify_api/model/**'
  - 'bodzify_api/models.py'

view:
  - 'bodzify_api/view/**'
  - 'bodzify_api/urls.py'

exception:
  - 'bodzify_api/exception/**'

utils:
  - 'bodzify_api/utils/**'

# Type labels - based on file types and purposes
test:
  - 'bodzify_api/test/**'
  - 'pytest.ini'
  - 'conftest.py'

documentation:
  - 'README.md'
  - 'CONTRIBUTING.md'
  - 'CHANGELOG.md'
  - 'code-style.md'
  - 'docs/**'
  - '*.md'

ci:
  - '.github/workflows/**'
  - '.github/ISSUE_TEMPLATE/**'
  - '.github/pull_request_template.md'

dependencies:
  - 'requirements.txt'
  - 'setup.py'
  - 'pyproject.toml'
  - 'Pipfile'
  - 'poetry.lock'
  - 'package.json'
  - 'package-lock.json'

docker:
  - 'Dockerfile'
  - 'docker-compose.yml'
  - 'docker-compose.*.yml'
  - '.dockerignore'

scripts:
  - 'scripts/**'

migration:
  - 'bodzify_api/migrations/**'

settings:
  - 'bodzify_api/settings.py'

admin:
  - 'bodzify_api/admin.py'

fixtures:
  - 'bodzify_api/fixtures/**'

logging:
  - 'bodzify_api/logging/**'

management:
  - 'bodzify_api/management/**'

validator:
  - 'bodzify_api/validator/**'
