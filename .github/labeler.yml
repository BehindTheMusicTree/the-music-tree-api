  - 'bodzify_api/test/view/tag/**'

playlist:
  - 'bodzify_api/model/playlist/**'
  - 'bodzify_api/serializer/model/playlist/**'
  - 'bodzify_api/view/viewset/model/playlist/**'
  - 'bodzify_api/test/view/playlist/**'
  - 'bodzify_api/filtering/set/playlist/**'

play:
  - 'bodzify_api/model/play/**'
  - 'bodzify_api/serializer/model/play/**'
