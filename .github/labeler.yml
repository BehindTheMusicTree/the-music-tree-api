# Auto-labeler configuration for Bodzify API
# Labels are automatically applied based on file paths changed in PRs

# Component labels - based on main features/modules
track:
  - 'bodzify_api/model/track/**'
  - 'bodzify_api/serializer/model/track/**'
  - 'bodzify_api/view/viewset/model/lib_track/**'
  - 'bodzify_api/test/view/track/**'
  - 'bodzify_api/utils/audio_metadata/**'
  - 'bodzify_api/utils/AudioFile.py'
  - 'bodzify_api/validator/TrackFileValidator.py'
  - 'bodzify_api/validator/TrackUrlValidator.py'

artist:
  - 'bodzify_api/model/artist/**'
  - 'bodzify_api/serializer/model/artist/**'
  - 'bodzify_api/view/viewset/model/ArtistViewSet.py'
  - 'bodzify_api/test/view/artist/**'
  - 'bodzify_api/filtering/set/artist/**'

