worker_processes 1;

events {
    worker_connections 1024;
}

http {
    upstream bodzify_api {
        server web:8000;
    }

    # server {
    #     listen 80;
    #     server_name bodzify.com www.bodzify.com;

    #     location / {
    #         proxy_pass http://web;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #     }
    # }

    server {
        listen 443 ssl;
        server_name bodzify.com www.bodzify.com;

        ssl_certificate /etc/ssl/bodzify/www.bodzify.com.chained.crt;
        ssl_certificate_key /etc/ssl/bodzify/www.bodzify.com.key;

        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

        location /static/ {
            alias /var/www/static/;
        }

        location / {
            proxy_pass http://bodzify_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}