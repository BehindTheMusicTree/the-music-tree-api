version: '3.8'

services:
  web:
    image: mignot/bodzify-api:latest
    working_dir: /home/app/webapp/
    container_name: BODZIFY_API
    command: gunicorn --certfile=/etc/ssl/bodzify/www_bodzify_com.crt --keyfile=/etc/ssl/bodzify/www.bodzify.com.key --bind 0.0.0.0:443 -k uvicorn.workers.UvicornWorker bodzify_api.asgi:application
    volumes:
      - /var/www/bodzify-api/static/:/var/www/bodzify-api/static/
      - /etc/ssl/bodzify/:/etc/ssl/bodzify/
      - /var/log/bodzify-api:/var/log/bodzify-api/
      - /var/lib/bodzify-api/media/:/var/lib/bodzify-api/media/
    expose:
      - 443:443
  nginx:
    build: ./nginx
    ports:
      - 443:443
    depends_on:
      - web
