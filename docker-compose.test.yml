version: '3.8'

services:
  web:
    working_dir: /home/app/webapp/
    image: mignot/bodzify-api:latest
    container_name: BODZIFY_API
    user: bodzify
    restart: always
    command: gunicorn wsgi:application -w 4 --bind 0.0.0.0:8000 --error-logfile=/var/log/gunicorn/error.log --log-level=info --access-logfile=/var/log/gunicorn/access.log
    volumes:
      - /var/log/bodzify-api/:/var/log/
      - /var/lib/bodzify-api/media/:/var/lib/bodzify-api/media/
    ports:
      - "8000:8000"
  nginx:
    image: nginx:latest
    container_name: NGINX
    restart: always
    volumes:
      - /var/www/static/:/var/www/static/
      - /etc/ssl/bodzify/:/etc/ssl/bodzify/
      - /etc/nginx/conf.d/:/etc/nginx/conf.d/
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
