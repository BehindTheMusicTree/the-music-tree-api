version: '3.8'

services:
  web:
    working_dir: /home/app/webapp/
    image: mignot/bodzify-api:latest
    container_name: BODZIFY_API
    restart: always
    command: gunicorn bodzify_api.wsgi:application --bind 0.0.0.0:8000 
    # --error-logfile=/var/log/gunicorn/error.log --log-level=info --access-logfile=/var/log/gunicorn/access.log
    volumes:
      # - /var/log/bodzify-api/:/var/log/
      - /var/lib/bodzify-api/media/:/var/lib/bodzify-api/media/
      - bodzify-staticfiles:/home/app/webapp/staticfiles/
    expose:
      - 8000

  nginx:
    image: nginx:latest
    container_name: NGINX
    restart: always
    volumes:
      - bodzify-staticfiles:/var/www/static/
      - /etc/ssl/bodzify/:/etc/ssl/bodzify/
      - /etc/nginx/nginx.conf:/etc/nginx/conf.d/nginx.conf
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web

volumes:
  bodzify-staticfiles: